<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>自测 B · 中文 label + 验证码</title>
<style>
  body { font-family: sans-serif; background: #f2f4f7; margin: 0; padding: 24px; }
  .card { background: #fff; border-radius: 12px; padding: 20px; }
  h2 { margin: 0 0 4px; font-size: 18px; }
  p.tip { color: #5f6368; font-size: 13px; }
  label { display: block; margin-top: 12px; font-size: 14px; }
  input { width: 100%; box-sizing: border-box; margin-top: 4px; padding: 10px;
          border: 1px solid #ccc; border-radius: 8px; font-size: 15px; }
  .row { display: flex; gap: 8px; }
  .row input { flex: 1; }
  .captcha { width: 96px; height: 42px; margin-top: 4px; background: #ffe082;
             border: 1px solid #ccc; border-radius: 8px; display: flex;
             align-items: center; justify-content: center; font-size: 18px;
             letter-spacing: 4px; color: #bf360c; }
  button { margin-top: 16px; width: 100%; padding: 12px; border: 0; border-radius: 8px;
           background: #1565c0; color: #fff; font-size: 16px; }
  #result { margin-top: 12px; color: #2e7d32; font-size: 14px; }
</style>
</head>
<body>
<div class="card">
  <h2>统一身份认证（模拟）</h2>
  <p class="tip">变体 B：中文标签 + 图形验证码。预期：只填学号/密码，<b>不碰验证码、不点登录</b>，并显示"需手动完成"提示。</p>
  <form onsubmit="document.getElementById('result').textContent='你手动点了登录（工具不应代点）'; return false;">
    <label>学号
      <input type="text" id="xh" name="studentId" placeholder="请输入学号" autocomplete="off">
    </label>
    <label>密码
      <input type="password" id="mm" name="passwd" placeholder="请输入密码" autocomplete="off">
    </label>
    <label>验证码</label>
    <div class="row">
      <input type="text" id="captcha" name="captcha" placeholder="图形验证码" autocomplete="off">
      <div class="captcha">A3K9</div>
    </div>
    <button type="submit">登录</button>
    <div id="result"></div>
  </form>
</div>
</body>
</html>
